<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مدارس الثقافة الرقمية</title>
  <meta name="description" content="مدارس الثقافة الرقمية - Digital Culture School" />
  <style>
    :root {
      --bg: #081221;
      --bg-2: #101d33;
      --panel: rgba(255,255,255,0.06);
      --panel-border: rgba(255,255,255,0.12);
      --text: #f5f7ff;
      --muted: #d2dcff;
      --primary: #74a8ff;
      --accent: #8fe9c8;
      --shadow: rgba(0,0,0,0.32);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, Tahoma, sans-serif;
      background:
        radial-gradient(circle at top right, rgba(116,168,255,0.15), transparent 24%),
        radial-gradient(circle at bottom left, rgba(143,233,200,0.10), transparent 22%),
        linear-gradient(135deg, var(--bg), var(--bg-2));
      color: var(--text);
      padding: 24px;
    }

    .container {
      width: min(960px, 100%);
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 28px;
      padding: 48px 32px;
      box-shadow: 0 28px 70px var(--shadow);
      backdrop-filter: blur(10px);
      text-align: center;
    }

    .tag {
      display: inline-block;
      margin-bottom: 18px;
      padding: 8px 18px;
      border-radius: 999px;
      border: 1px solid rgba(116,168,255,0.5);
      background: rgba(116,168,255,0.08);
      color: var(--primary);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.5rem, 6vw, 5rem);
      line-height: 1.1;
      letter-spacing: -2px;
    }

    .subtitle {
      max-width: 760px;
      margin: 18px auto 0;
      color: var(--muted);
      font-size: clamp(1rem, 2vw, 1.35rem);
      line-height: 1.8;
    }

    .actions {
      margin-top: 32px;
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-block;
      text-decoration: none;
      color: var(--text);
      border-radius: 12px;
      padding: 15px 26px;
      font-weight: bold;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      opacity: 0.96;
    }

    .btn.primary {
      background: linear-gradient(135deg, var(--primary), #7d6ce8);
      box-shadow: 0 14px 26px rgba(116,168,255,0.35);
    }

    .btn.secondary {
      border: 1px solid var(--panel-border);
      background: rgba(255,255,255,0.02);
    }

    .stats {
      margin-top: 36px;
      display: flex;
      justify-content: center;
      gap: 18px;
      flex-wrap: wrap;
    }

    .stat {
      min-width: 150px;
      border-radius: 16px;
      border: 1px solid var(--panel-border);
      background: rgba(255,255,255,0.03);
      padding: 18px 20px;
    }

    .stat strong {
      display: block;
      font-size: 1.8rem;
      margin-bottom: 6px;
    }

    .stat span {
      color: var(--muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="tag">Digital Learning</div>
    <h1>مدارس الثقافة الرقمية</h1>
    <p class="subtitle">
      نُعِدُ الطلاب للتعلم الرقمي، الإبداع، والتفكير النقدي عبر بيئة تعليمية حديثة ومبتكرة.
    </p>

    <div class="actions">
      <a class="btn primary" href="#about">اعرف المزيد</a>
      <a class="btn secondary" href="#contact">تواصل معنا</a>
    </div>

    <div class="stats">
      <div class="stat">
        <strong>2025</strong>
        <span>تأسست</span>
      </div>
      <div class="stat">
        <strong>100%</strong>
        <span>تعلّم رقمي</span>
      </div>
      <div class="stat">
        <strong>24/7</strong>
        <span>وصول مستمر</span>
      </div>
    </div>
  </main>
</body>
</html>
